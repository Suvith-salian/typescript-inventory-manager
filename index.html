<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Inventory Manager</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
        }

        header {
            background: #222;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        input {
            padding: 12px;
            flex: 1;
            min-width: 200px;
        }

        button {
            padding: 12px 18px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #productList {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px #ccc;
        }
    </style>
</head>

<body>

<header>
    <h1>Product Inventory Manager</h1>
    <p>Advanced Web Technologies - TypeScript</p>
</header>

<div class="container">

    <div class="controls">

        <input
            type="text"
            id="searchInput"
            placeholder="Search product..."
        >

        <button id="showAll">
            Show All
        </button>

        <button id="showAvailable">
            Available Products
        </button>

        <button id="applyDiscount">
            Apply 10% Discount
        </button>

    </div>

    <div id="productList"></div>

</div>

<script type="module" src="./dist/main.js"></script>

</body>
</html>
